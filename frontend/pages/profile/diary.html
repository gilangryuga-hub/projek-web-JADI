<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diary - NetList</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/pages/profile/navbar.css" />
    <link rel="stylesheet" href="../../css/pages/profile/diary.css" />
  </head>
  <body>
    <div class="navbar-container">
      <header class="top-bar">
        <button
          id="sidebar-toggle"
          class="menu-btn"
          type="button"
          aria-label="Toggle Sidebar"
          aria-expanded="false"
        >
          <span></span><span></span><span></span></button
        ><a href="../../index.html" class="top-bar__logo">Net<em>List</em></a>
        <div class="top-bar__actions"><div class="user-avatar">ND</div></div>
      </header>
      <div id="sidebar-overlay" class="sidebar-overlay"></div>
      <aside class="sidebar">
        <div class="sidebar-header">
          <p class="sidebar-title">Menu Profil</p>
        </div>
        <nav id="main-nav">
          <ul class="nav-list">
            <li>
              <a href="../../index.html" class="nav-link"
                ><i class="fa-solid fa-house nav-icon"></i><span>Home</span></a
              >
            </li>
            <li>
              <a href="profile.html" class="nav-link"
                ><i class="fa-solid fa-user nav-icon"></i
                ><span>Profile</span></a
              >
            </li>
            <li>
              <a href="films.html" class="nav-link"
                ><i class="fa-solid fa-film nav-icon"></i><span>Films</span></a
              >
            </li>
            <li>
              <a
                href="diary.html"
                class="nav-link is-active"
                aria-current="page"
                ><i class="fa-solid fa-book-bookmark nav-icon"></i
                ><span>Diary</span></a
              >
            </li>
            <li>
              <a href="reviews.html" class="nav-link"
                ><i class="fa-solid fa-comment-dots nav-icon"></i
                ><span>Reviews</span></a
              >
            </li>
            <li>
              <a href="likes.html" class="nav-link"
                ><i class="fa-solid fa-heart nav-icon"></i><span>Likes</span></a
              >
            </li>
            <li>
              <a href="network.html" class="nav-link"
                ><i class="fa-solid fa-user-group nav-icon"></i
                ><span>Network</span></a
              >
            </li>
          </ul>
        </nav>
        <div class="sidebar-footer">
          <div class="profile-preview">
            <div class="user-avatar sm">ND</div>
            <div class="profile-info">
              <span class="profile-name">Naufal Dzaky</span
              ><span class="profile-role">Film Enthusiast</span>
            </div>
          </div>
        </div>
      </aside>
      <main class="main-content profile-main">
        <div id="profile-status" class="profile-status" role="status">
          Memuat diary...
        </div>
        <div id="profile-content" hidden>
          <section class="profile-section feature-page diary-page">
            <header class="diary-page-header">
              <div class="diary-title-group">
                <p class="section-eyebrow">Your watch journal</p>
                <div class="diary-title-row">
                  <h1>Diary</h1>
                  <span class="collection-count" id="diary-count">0 entries</span>
                </div>
              </div>
              <div class="diary-toolbar" aria-label="Diary filters">
                <label class="diary-filter">
                  <span>Rating</span>
                  <select id="diary-rating-filter">
                    <option value="all">All ratings</option>
                    <option value="5">5 stars</option>
                    <option value="4">4+ stars</option>
                    <option value="3">3+ stars</option>
                    <option value="2">2+ stars</option>
                    <option value="1">1+ stars</option>
                  </select>
                </label>
                <label class="diary-filter">
                  <span>Diary year</span>
                  <select id="diary-year-filter">
                    <option value="all">All years</option>
                  </select>
                </label>
                <label class="diary-filter">
                  <span>Sort by</span>
                  <select id="diary-sort-filter">
                    <option value="watched-desc">Watched date</option>
                    <option value="watched-asc">Oldest first</option>
                    <option value="title">Film title</option>
                    <option value="rating">Rating</option>
                  </select>
                </label>
                <button
                  id="diary-poster-toggle"
                  class="diary-poster-toggle"
                  type="button"
                  aria-label="Hide film posters"
                  aria-pressed="false"
                  title="Hide film posters"
                >
                  <i class="fa-solid fa-eye" aria-hidden="true"></i>
                </button>
              </div>
            </header>
            <div class="diary-table-wrap">
              <div class="diary-table" role="table" aria-label="Diary entries">
                <div class="diary-table-head" role="row">
                  <span role="columnheader">Month</span>
                  <span role="columnheader">Day</span>
                  <span role="columnheader">Film</span>
                  <span role="columnheader">Released</span>
                  <span role="columnheader">Rating</span>
                  <span role="columnheader">Like</span>
                  <span role="columnheader">Rewatch</span>
                  <span role="columnheader">Review</span>
                  <span role="columnheader">Edit</span>
                </div>
                <div id="diary-table-body"></div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script src="../../javascript/config/api.js"></script>
    <script src="../../javascript/utils/helpers.js"></script>
    <script src="../../javascript/utils/apiClient.js"></script>
    <script src="../../javascript/services/authService.js"></script>
    <script src="../../javascript/services/watchlistService.js"></script>
    <script src="../../javascript/services/journalService.js"></script>
    <script src="../../javascript/components/authModal.js"></script>
    <script src="../../javascript/components/journalModal.js"></script>
    <script src="../../javascript/pages/profile/navbar.js"></script>
    <script src="../../javascript/pages/profile/profile-data.js"></script>
    <script src="../../javascript/pages/profile/diary.js"></script>
  </body>
</html>
